<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zekke Menü QR Kod Oluşturucu</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #032d20;
      color: #f6f0e4;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(100%, 520px);
      padding: 32px;
      border: 1px solid rgba(216, 176, 100, 0.28);
      border-radius: 24px;
      background: #063d2b;
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-family: Georgia, serif;
    }

    p {
      color: rgba(255,255,255,.7);
      line-height: 1.6;
    }

    input {
      width: 100%;
      margin-top: 14px;
      padding: 15px 16px;
      border: 1px solid rgba(216, 176, 100, 0.28);
      border-radius: 14px;
      outline: none;
      color: #fff;
      background: rgba(255,255,255,.06);
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px 16px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      color: #032d20;
      background: #d8b064;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 26px;
      padding: 18px;
      border-radius: 18px;
      background: #fff;
    }

    #qrcode:empty {
      display: none;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>QR Kod Oluştur</h1>
    <p>
      GitHub Pages bağlantınızı aşağıya yapıştırın. QR kod otomatik oluşturulacaktır.
    </p>

    <input
      id="urlInput"
      type="url"
      placeholder="https://kullaniciadi.github.io/zekke-menu/"
    />

    <button type="button" onclick="createQr()">QR Kod Oluştur</button>

    <div id="qrcode"></div>

    <p class="note">
      QR kodun üzerine sağ tıklayıp görsel olarak kaydedebilirsiniz.
    </p>
  </main>

  <script>
    function createQr() {
      const value = document.getElementById("urlInput").value.trim();
      const target = document.getElementById("qrcode");

      if (!value) {
        alert("Lütfen GitHub Pages bağlantınızı yazın.");
        return;
      }

      target.innerHTML = "";

      new QRCode(target, {
        text: value,
        width: 240,
        height: 240,
        colorDark: "#032d20",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  </script>
</body>
</html>
